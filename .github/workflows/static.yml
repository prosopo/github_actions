# Lints and format checks for any Prosopo repo, called with workflow_call. Each language's job
# runs only when the repo has that language and the change touched it, so one
# file serves captcha, captcha-private and Protect unchanged. Every pnpm repo exposes
# the same turbo task names (lint, lint:rust, lint:py / test, test:rust, test:py);
# npm, Go, PHP and pnpm-less repos pass their own commands. pnpm is set up only
# when the root lockfile is pnpm-lock.yaml, npm ci only for package-lock.json.

name: static

on:
  workflow_call:
    inputs:
      actions-ref:
        description: "Commit of prosopo/github_actions whose actions this uses; pass the SHA the caller pins this workflow at (see cache-main.yml)."
        type: string
        required: true
      runs-on:
        description: "Runner for every job: a label, or a JSON array of labels (pick-runner output)."
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: "Per-job limit for the language jobs."
        type: number
        default: 20
      working-directory:
        description: "Directory the repo's workspace lives in (the self-test points this at a fixture)."
        type: string
        default: "."
      exclude-paths:
        description: "Whitespace-separated directories (relative to working-directory) language detection ignores."
        type: string
        default: ""
      turbo-cache-artifact:
        description: "Turbo cache artifact from build.yml to restore before the js job, so it reuses that run's builds; empty skips it."
        type: string
        default: ""
      js-command:
        description: "Command for the js job."
        type: string
        default: "pnpm turbo run lint --continue"
      rust-command:
        description: "Command for the rust job."
        type: string
        default: "pnpm turbo run lint:rust --continue"
      python-command:
        description: "Command for the python job."
        type: string
        default: "pnpm turbo run lint:py --continue"
      go-command:
        description: "Command for the go job."
        type: string
        default: "go vet ./..."
      php-command:
        description: "Command for the php job."
        type: string
        default: "composer run-script lint"
      php-version:
        description: "PHP version for the php job."
        type: string
        default: "8.3"

permissions:
  contents: read

jobs:
  changes:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft) }}
    runs-on: ${{ fromJSON(startsWith(inputs.runs-on, '[') && inputs.runs-on || toJSON(inputs.runs-on)) }}
    timeout-minutes: 5
    outputs:
      js: ${{ steps.detect.outputs.js-changed }}
      rust: ${{ steps.detect.outputs.rust-changed }}
      python: ${{ steps.detect.outputs.python-changed }}
      go: ${{ steps.detect.outputs.go-changed }}
      php: ${{ steps.detect.outputs.php-changed }}
      package-manager: ${{ steps.detect.outputs.package-manager }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      # This repo's actions at actions-ref; see cache-main.yml's input for why.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          repository: prosopo/github_actions
          ref: ${{ inputs.actions-ref }}
          path: .shared-actions
      - id: detect
        uses: ./.shared-actions/.github/actions/detect-languages
        timeout-minutes: 3
        with:
          dir: ${{ inputs.working-directory }}
          exclude: ${{ inputs.exclude-paths }}
          base: ${{ github.event.pull_request.base.sha || github.event.before }}

  js:
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' }}
    runs-on: ${{ fromJSON(startsWith(inputs.runs-on, '[') && inputs.runs-on || toJSON(inputs.runs-on)) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          submodules: recursive
      # This repo's actions at actions-ref; see cache-main.yml's input for why.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          repository: prosopo/github_actions
          ref: ${{ inputs.actions-ref }}
          path: .shared-actions
      - uses: ./.shared-actions/.github/actions/setup-pnpm
        if: ${{ needs.changes.outputs.package-manager == 'pnpm' }}
        timeout-minutes: 15
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc
          working-directory: ${{ inputs.working-directory }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: ${{ needs.changes.outputs.package-manager == 'npm' }}
        timeout-minutes: 5
        with:
          # No .nvmrc: the runner's own node.
          node-version-file: ${{ hashFiles(format('{0}/.nvmrc', inputs.working-directory)) != '' && format('{0}/.nvmrc', inputs.working-directory) || '' }}
      - name: npm ci
        if: ${{ needs.changes.outputs.package-manager == 'npm' }}
        timeout-minutes: 15
        working-directory: ${{ inputs.working-directory }}
        run: timeout 840 npm ci --no-audit --no-fund
      # The caller's own lint/tests must not see this repo's checkout; it is
      # put back before post steps, which re-read the local actions.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: ${{ inputs.turbo-cache-artifact != '' }}
        timeout-minutes: 10
        with:
          name: ${{ inputs.turbo-cache-artifact }}
          path: ${{ inputs.working-directory }}/.turbo-cache
      - name: hide shared actions
        timeout-minutes: 1
        run: mv .shared-actions "$RUNNER_TEMP/shared-actions"
      - name: static js
        timeout-minutes: ${{ inputs.timeout-minutes }}
        working-directory: ${{ inputs.working-directory }}
        env:
          CMD: ${{ inputs.js-command }}
          RESTORED_CACHE: ${{ inputs.turbo-cache-artifact }}
        run: |
          if [ -n "$RESTORED_CACHE" ]; then export TURBO_CACHE_DIR="$PWD/.turbo-cache"; fi
          eval "$CMD"
      - name: restore shared actions
        if: ${{ always() }}
        timeout-minutes: 1
        run: if [ -d "$RUNNER_TEMP/shared-actions" ]; then mv "$RUNNER_TEMP/shared-actions" .shared-actions; fi

  rust:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ fromJSON(startsWith(inputs.runs-on, '[') && inputs.runs-on || toJSON(inputs.runs-on)) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          submodules: recursive
      # This repo's actions at actions-ref; see cache-main.yml's input for why.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          repository: prosopo/github_actions
          ref: ${{ inputs.actions-ref }}
          path: .shared-actions
      - uses: ./.shared-actions/.github/actions/rust-toolchain
        timeout-minutes: 10
      - uses: ./.shared-actions/.github/actions/setup-pnpm
        if: ${{ needs.changes.outputs.package-manager == 'pnpm' }}
        timeout-minutes: 15
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc
          working-directory: ${{ inputs.working-directory }}
      # The caller's own lint/tests must not see this repo's checkout; it is
      # put back before post steps, which re-read the local actions.
      - name: hide shared actions
        timeout-minutes: 1
        run: mv .shared-actions "$RUNNER_TEMP/shared-actions"
      - name: static rust
        timeout-minutes: ${{ inputs.timeout-minutes }}
        working-directory: ${{ inputs.working-directory }}
        env:
          CMD: ${{ inputs.rust-command }}
        run: eval "$CMD"
      - name: restore shared actions
        if: ${{ always() }}
        timeout-minutes: 1
        run: if [ -d "$RUNNER_TEMP/shared-actions" ]; then mv "$RUNNER_TEMP/shared-actions" .shared-actions; fi

  python:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ${{ fromJSON(startsWith(inputs.runs-on, '[') && inputs.runs-on || toJSON(inputs.runs-on)) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          submodules: recursive
      # This repo's actions at actions-ref; see cache-main.yml's input for why.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          repository: prosopo/github_actions
          ref: ${{ inputs.actions-ref }}
          path: .shared-actions
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        timeout-minutes: 5
      - uses: ./.shared-actions/.github/actions/setup-pnpm
        if: ${{ needs.changes.outputs.package-manager == 'pnpm' }}
        timeout-minutes: 15
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc
          working-directory: ${{ inputs.working-directory }}
      # The caller's own lint/tests must not see this repo's checkout; it is
      # put back before post steps, which re-read the local actions.
      - name: hide shared actions
        timeout-minutes: 1
        run: mv .shared-actions "$RUNNER_TEMP/shared-actions"
      - name: static python
        timeout-minutes: ${{ inputs.timeout-minutes }}
        working-directory: ${{ inputs.working-directory }}
        env:
          CMD: ${{ inputs.python-command }}
        run: eval "$CMD"
      - name: restore shared actions
        if: ${{ always() }}
        timeout-minutes: 1
        run: if [ -d "$RUNNER_TEMP/shared-actions" ]; then mv "$RUNNER_TEMP/shared-actions" .shared-actions; fi

  go:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ${{ fromJSON(startsWith(inputs.runs-on, '[') && inputs.runs-on || toJSON(inputs.runs-on)) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          submodules: recursive
      # This repo's actions at actions-ref; see cache-main.yml's input for why.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          repository: prosopo/github_actions
          ref: ${{ inputs.actions-ref }}
          path: .shared-actions
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        timeout-minutes: 5
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      # The caller's own lint/tests must not see this repo's checkout; it is
      # put back before post steps, which re-read the local actions.
      - name: hide shared actions
        timeout-minutes: 1
        run: mv .shared-actions "$RUNNER_TEMP/shared-actions"
      - name: static go
        timeout-minutes: ${{ inputs.timeout-minutes }}
        working-directory: ${{ inputs.working-directory }}
        env:
          CMD: ${{ inputs.go-command }}
        run: eval "$CMD"
      - name: restore shared actions
        if: ${{ always() }}
        timeout-minutes: 1
        run: if [ -d "$RUNNER_TEMP/shared-actions" ]; then mv "$RUNNER_TEMP/shared-actions" .shared-actions; fi

  php:
    needs: changes
    if: ${{ needs.changes.outputs.php == 'true' }}
    runs-on: ${{ fromJSON(startsWith(inputs.runs-on, '[') && inputs.runs-on || toJSON(inputs.runs-on)) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          submodules: recursive
      # This repo's actions at actions-ref; see cache-main.yml's input for why.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          repository: prosopo/github_actions
          ref: ${{ inputs.actions-ref }}
          path: .shared-actions
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        timeout-minutes: 5
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer
      - name: composer install
        if: ${{ hashFiles(format('{0}/composer.json', inputs.working-directory)) != '' }}
        timeout-minutes: 10
        working-directory: ${{ inputs.working-directory }}
        run: timeout 540 composer install --no-interaction --no-progress
      # The caller's own lint/tests must not see this repo's checkout; it is
      # put back before post steps, which re-read the local actions.
      - name: hide shared actions
        timeout-minutes: 1
        run: mv .shared-actions "$RUNNER_TEMP/shared-actions"
      - name: static php
        timeout-minutes: ${{ inputs.timeout-minutes }}
        working-directory: ${{ inputs.working-directory }}
        env:
          CMD: ${{ inputs.php-command }}
        run: eval "$CMD"
      - name: restore shared actions
        if: ${{ always() }}
        timeout-minutes: 1
        run: if [ -d "$RUNNER_TEMP/shared-actions" ]; then mv "$RUNNER_TEMP/shared-actions" .shared-actions; fi
