# Dependency, secret and code scanning for any repo: pnpm or npm audit by the
# root lockfile, cargo audit when it has Rust, gitleaks and semgrep always, and
# on PRs a review of the dependencies the PR adds.
# Called with workflow_call. On a PR both scanners gate only what the PR adds
# (gitleaks its commits, semgrep findings new since the base), so existing
# backlog never blocks unrelated work; other events scan the whole tree and
# semgrep only reports.

name: security

on:
  workflow_call:
    inputs:
      actions-ref:
        description: "Commit of prosopo/github_actions whose actions this uses; pass the SHA the caller pins this workflow at (see cache-main.yml)."
        type: string
        required: true
      runs-on: {description: "Runner label.", type: string, default: "ubuntu-latest"}
      dependency-review-severity:
        description: "Lowest severity (low, moderate, high, critical) of a newly added vulnerable dependency that fails the PR."
        type: string
        default: "high"
      semgrep-exclude:
        description: "Extra paths semgrep skips, one per line (node_modules, dist and *.min.js always are)."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  scan:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft) }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      # This repo's actions at actions-ref; see cache-main.yml's input for why.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          repository: prosopo/github_actions
          ref: ${{ inputs.actions-ref }}
          path: .shared-actions
      - id: detect
        uses: ./.shared-actions/.github/actions/detect-languages
        timeout-minutes: 3
      - name: pnpm audit
        if: ${{ steps.detect.outputs.package-manager == 'pnpm' }}
        timeout-minutes: 5
        run: timeout 240 npx --yes pnpm@10 audit --prod --audit-level high
      - name: npm audit
        if: ${{ steps.detect.outputs.package-manager == 'npm' }}
        timeout-minutes: 5
        run: timeout 240 npm audit --omit=dev --audit-level=high
      - name: cargo audit
        if: ${{ steps.detect.outputs.has-rust == 'true' }}
        timeout-minutes: 10
        run: |
          timeout 420 cargo install --locked cargo-audit
          timeout 120 cargo audit
      - name: gitleaks
        timeout-minutes: 5
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: |
          timeout 4m curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          timeout 240 ./gitleaks git --no-banner --redact ${RANGE:+--log-opts="$RANGE"} .

  semgrep:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft) }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    container:
      image: semgrep/semgrep:1.145.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          # --baseline-commit needs the PR base in the clone.
          fetch-depth: 0
      - name: Trust the workspace
        timeout-minutes: 1
        run: git config --global --add safe.directory "$PWD"
      - name: semgrep
        timeout-minutes: 25
        # Report-only off PRs: the full tree carries backlog nobody's change added.
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          BASELINE: ${{ github.event.pull_request.base.sha }}
          EXCLUDE: ${{ inputs.semgrep-exclude }}
        # POSIX sh, not bash: the semgrep image's default shell is sh, and
        # GitHub runs container steps with it. Arguments build up in "$@".
        run: |
          set -eu
          set -- --config=p/default --config=p/typescript --config=p/nodejs --config=p/secrets \
            --skip-unknown-extensions --metrics=off --error \
            --exclude=node_modules --exclude=dist --exclude='**/*.min.js'
          while IFS= read -r path; do
            if [ -n "$path" ]; then set -- "$@" --exclude="$path"; fi
          done <<EOF
          $EXCLUDE
          EOF
          if [ -n "$BASELINE" ]; then set -- "$@" --baseline-commit "$BASELINE"; fi
          timeout 24m semgrep scan "$@"

  # Fails a PR that adds a dependency with a vulnerability at or above
  # dependency-review-severity, or a license outside
  # .github/dependency-review/allowed-licenses.txt. Runs on drafts too: it is
  # cheap, and the earlier a bad dependency is flagged the less is built on it.
  # Public repos use GitHub's dependency-graph compare API; on private repos
  # that API returns 403 without GitHub Code Security, so they scan base and
  # head lockfiles with osv-scanner and diff (scripts/dependency_diff.py).
  dependency-review:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          repository: prosopo/github_actions
          ref: ${{ inputs.actions-ref }}
          path: .shared-actions
      - id: allow
        name: Read the license allowlist
        timeout-minutes: 1
        run: echo "licenses=$(grep -v '^#' .shared-actions/.github/dependency-review/allowed-licenses.txt | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - name: Review added dependencies (dependency graph)
        if: ${{ !github.event.repository.private }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        timeout-minutes: 5
        with:
          fail-on-severity: ${{ inputs.dependency-review-severity }}
          allow-licenses: ${{ steps.allow.outputs.licenses }}
          comment-summary-in-pr: never
      - name: Review added dependencies (osv-scanner)
        if: ${{ github.event.repository.private }}
        timeout-minutes: 10
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LICENSES: ${{ steps.allow.outputs.licenses }}
          SEVERITY: ${{ inputs.dependency-review-severity }}
          OSV: ${{ runner.temp }}/osv-scanner
        run: |
          timeout 2m curl -fsSL -o "$OSV" https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x "$OSV"
          git worktree add -q "$RUNNER_TEMP/base" "$BASE"
          # Exit 1 means findings, which the diff judges; >1 is a scanner error.
          scan() { timeout 4m "$OSV" scan source -r --allow-no-lockfiles --licenses="$LICENSES" --format json "$1" > "$2" || [ $? -eq 1 ]; }
          scan "$RUNNER_TEMP/base" "$RUNNER_TEMP/base.json"
          scan . "$RUNNER_TEMP/head.json"
          python3 .shared-actions/.github/scripts/dependency_diff.py --base "$RUNNER_TEMP/base.json" --head "$RUNNER_TEMP/head.json" \
            --severity "$SEVERITY" --summary-file "$GITHUB_STEP_SUMMARY"
