name: "save_npm_cache"

# Every step is gated on runner type, mirroring restore_npm_cache /
# restore_cargo_cache which already skip on self-hosted. Our self-hosted runners
# are persistent (one long-lived VM taking job after job), so the cached
# directories under $HOME survive between jobs and the upload is WAN traffic for
# nothing. It is also not merely wasteful: the cleanup step below deletes every
# key but the newest, so a cache saved on self-hosted hardware displaces the
# ones the GitHub-hosted runners restore from.

inputs:
  save-on-self-hosted:
    description: "Whether to save the npm cache to the GitHub cache backend on self-hosted runners"
    required: false
    default: "false"

runs:
    using: "composite"
    steps:

      # dirs must exist before cache restore
      - name: Make dirs
        if: ${{ runner.environment != 'self-hosted' || inputs.save-on-self-hosted == 'true' }}
        shell: bash
        run: |
          mkdir -p ~/.npm
          mkdir -p ~/.cache/Cypress
          mkdir -p .turbo/cache
          mkdir -p .nx/cache

      # checks the cache is valid and compresses it
      - name: Verify npm cache
        if: ${{ runner.environment != 'self-hosted' || inputs.save-on-self-hosted == 'true' }}
        shell: bash
        run: |
          npm cache verify

      - name: Save npm cache
        if: ${{ runner.environment != 'self-hosted' || inputs.save-on-self-hosted == 'true' }}
        uses: actions/cache/save@v4
        with:
            path: |
              ~/.npm
              ~/.cache/Cypress
              .turbo/cache
              .nx/cache
            key: npm-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      # node_modules is saved under an EXACT lockfile-hash key (matching restore_npm_cache) so that
      # lockfile-unchanged consumers get an exact hit and can skip `npm ci`. The key is stable across
      # runs while the lockfile is unchanged, so actions/cache/save is a no-op (warns, doesn't fail)
      # once the cache for a given lockfile already exists.
      - name: Save node_modules cache
        uses: actions/cache/save@v4
        with:
            path: |
              **/node_modules
            key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json') }}

      - name: Cleanup npm caches
        if: ${{ runner.environment != 'self-hosted' || inputs.save-on-self-hosted == 'true' }}
        shell: bash
        run: |
            # remove all but the latest cache, leaving only the cache we just saved
            echo "Fetching list of cache key"
            cacheKeys=$(gh cache list --sort created_at --order desc --limit 100 -R "${{ github.repository }}" --key "npm-${{ runner.os }}-${{ runner.arch }}-" | cut -f 1 | tail -n +3)
            echo caches to be removed:
            echo "${cacheKeys}"
            set +e
            for cacheKey in $cacheKeys
            do
                gh cache delete "$cacheKey" -R "${{ github.repository }}"
            done

      - name: Cleanup node_modules caches
        shell: bash
        run: |
            # node_modules caches are keyed by lockfile hash, so stale hashes accumulate as the
            # lockfile changes. Keep only the most recent (the one we just saved) and remove the rest.
            echo "Fetching list of node_modules cache keys"
            cacheKeys=$(gh cache list --sort created_at --order desc --limit 100 -R "${{ github.repository }}" --key "node-modules-${{ runner.os }}-${{ runner.arch }}-" | cut -f 1 | tail -n +2)
            echo caches to be removed:
            echo "${cacheKeys}"
            set +e
            for cacheKey in $cacheKeys
            do
                gh cache delete "$cacheKey" -R "${{ github.repository }}"
            done
