# Node from package.json, optional npm cache restore, pinned npm, `npm ci`.
# Legacy npm-workspace setup; pnpm repos use setup-pnpm instead.

name: "npm"
description: "Set up Node from package.json, optionally restore the npm cache, pin npm and run npm ci (legacy npm workspaces)."

inputs:
  npm_ci:
    description: 'Run npm ci'
    required: false
    default: true
  npm_ci_args:
    description: 'npm ci args'
    required: false
    default: ''
  restore_npm_cache:
    description: 'Restore npm cache'
    required: false
    default: true

runs:
    using: "composite"
    steps:

      # macOS runners have no coreutils timeout, which later steps wrap commands in
      - shell: bash
        run: command -v timeout >/dev/null || echo "$GITHUB_ACTION_PATH/../timeout-shim" >> "$GITHUB_PATH"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: 'package.json'

      - id: cache
        uses: prosopo/github_actions/.github/actions/restore_npm_cache@1e2f6e3907aad18cd1497d93e722790b51c0c66a  # main
        if: ${{ inputs.restore_npm_cache }}

      # `npm i -g npm` upgrades npm by renaming the live npm directory out of the
      # way to `.npm-<suffix>` and unpacking the new one in its place. The suffix
      # is stable for a given path, not random, so an install killed part-way --
      # a cancelled run, an agent restart -- leaves that directory behind, and
      # every later install on the same agent fails the rename with ENOTEMPTY.
      # The agent is then wedged for good: prosvr8-3 was left like that on
      # 2026-09-24 and failed this step on every job it picked up for a day.
      #
      # Doing nothing when npm is already the version we want avoids the rename
      # altogether, which on a self-hosted agent is every run after the first.
      # Sweeping the leftovers covers the agents already holding one.
      - name: install npm
        shell: bash
        # 11.6.3 cannot install a tree that uses `overrides`: npm/cli#8757.
        # Read from package.json `engines.npm` again once that is released fixed.
        env:
          NPM_VERSION: "11.6.2"
        run: |
          set -euo pipefail
          if [ "$(npm -v)" = "$NPM_VERSION" ]; then
            echo "npm $NPM_VERSION is already installed"
            exit 0
          fi
          rm -rf "$(npm prefix -g)/lib/node_modules"/.npm-*
          timeout 30m npm i -g "npm@$NPM_VERSION"

      # Skip `npm ci` when node_modules was restored from an exact-lockfile cache hit: the tree
      # already matches the lockfile, and `npm ci` would only delete it and reinstall the identical
      # tree (~2 min wasted). On a cache miss (or when caching is disabled) the output is not 'true'
      # and `npm ci` runs as normal, so this is always safe.
      - name: install project
        shell: bash
        if: ${{ inputs.npm_ci && steps.cache.outputs.node-modules-cache-hit != 'true' }}
        run: |
          # Unquoted on purpose: npm_ci_args is a list of flags and must word
          # split into separate arguments.
          # shellcheck disable=SC2086
          timeout 30m npm ci ${{ inputs.npm_ci_args }}

      - name: skipped install (node_modules cache hit)
        shell: bash
        if: ${{ inputs.npm_ci && steps.cache.outputs.node-modules-cache-hit == 'true' }}
        run: |
          echo "node_modules restored from exact-lockfile cache hit; skipping 'npm ci'."
