# Writes what restore-cache reads: pass the same name, key-files and suffix.
# Skipped on self-hosted by default for the reason save_cargo_cache gives: those
# runners are persistent, so the upload is WAN traffic for nothing and evicts
# entries the hosted runners restore from.

name: "save-cache"
description: "Save a GitHub cache under the standard <name>-<os>-<arch>-<hash> key."

inputs:
  name:
    description: "Cache family name, the first key segment."
    required: true
  path:
    description: "Newline-separated paths to save."
    required: true
  key-files:
    description: "Glob(s) hashed into the key, e.g. '**/Cargo.lock'. Empty leaves the hash out."
    required: false
    default: ""
  suffix:
    description: "Appended to the key after the hash."
    required: false
    default: ""
  key:
    description: "Full key, replacing the standard scheme."
    required: false
    default: ""
  save-on-self-hosted:
    description: "Also save on self-hosted runners."
    required: false
    default: "false"

outputs:
  key:
    description: "The key saved under."
    value: ${{ steps.key.outputs.key }}

runs:
  using: "composite"
  steps:

    - name: Compute cache key
      id: key
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        SUFFIX: ${{ inputs.suffix }}
        KEY: ${{ inputs.key }}
        FILES_HASH: ${{ inputs.key-files != '' && hashFiles(inputs.key-files) || '' }}
      run: |
        set -euo pipefail
        echo "key=${KEY:-$NAME-$RUNNER_OS-$RUNNER_ARCH-$FILES_HASH$SUFFIX}" >> "$GITHUB_OUTPUT"

    - name: Save cache
      if: ${{ runner.environment != 'self-hosted' || inputs.save-on-self-hosted == 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
