# Generic counterpart of restore_cargo_cache. Keys are
# `<name>-<os>-<arch>-<hash of key-files><suffix>` and a miss falls back to the
# newest `<name>-<os>-<arch>-` entry, so save-cache with the same name, key-files
# and suffix writes exactly what this reads.

name: "restore-cache"
description: "Restore a GitHub cache under the standard <name>-<os>-<arch>-<hash> key, with prefix fallback."

inputs:
  name:
    description: "Cache family name, the first key segment."
    required: true
  path:
    description: "Newline-separated paths to restore."
    required: true
  key-files:
    description: "Glob(s) hashed into the key, e.g. '**/Cargo.lock'. Empty leaves the hash out."
    required: false
    default: ""
  suffix:
    description: "Appended to the key after the hash."
    required: false
    default: ""
  key:
    description: "Full primary key, replacing the standard scheme. restore-keys still use the name prefix."
    required: false
    default: ""
  prefix-fallback:
    description: "On an exact miss, restore the newest entry sharing <name>-<os>-<arch>-."
    required: false
    default: "true"
  restore-on-self-hosted:
    description: "Also restore on self-hosted runners. Off by default: they are persistent and already hold the files."
    required: false
    default: "false"
  fail-on-cache-miss:
    description: "Fail the job when nothing is restored."
    required: false
    default: "false"

outputs:
  cache-hit:
    description: "'true' on an exact key match."
    value: ${{ steps.restore.outputs.cache-hit }}
  matched-key:
    description: "Key of the entry actually restored."
    value: ${{ steps.restore.outputs.cache-matched-key }}
  key:
    description: "The primary key that was looked up."
    value: ${{ steps.key.outputs.key }}

runs:
  using: "composite"
  steps:

    - name: Compute cache key
      id: key
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        SUFFIX: ${{ inputs.suffix }}
        KEY: ${{ inputs.key }}
        PREFIX_FALLBACK: ${{ inputs.prefix-fallback }}
        FILES_HASH: ${{ inputs.key-files != '' && hashFiles(inputs.key-files) || '' }}
      run: |
        set -euo pipefail
        prefix="$NAME-$RUNNER_OS-$RUNNER_ARCH-"
        restore_keys=""
        if [ "$PREFIX_FALLBACK" = "true" ]; then
          restore_keys="$prefix"
        fi
        {
          echo "key=${KEY:-$prefix$FILES_HASH$SUFFIX}"
          echo "restore-keys=$restore_keys"
        } >> "$GITHUB_OUTPUT"

    - name: Restore cache
      id: restore
      if: ${{ runner.environment != 'self-hosted' || inputs.restore-on-self-hosted == 'true' }}
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.restore-keys }}
        fail-on-cache-miss: ${{ inputs.fail-on-cache-miss }}
