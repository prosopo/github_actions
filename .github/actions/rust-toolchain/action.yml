# Installs the toolchain rust-toolchain.toml names, with its targets and
# components, so CI and local builds cannot disagree. First evicts stale
# entries from a self-hosted VM's caches (cache-maintenance), because cargo
# builds are what fill those disks.

name: "rust-toolchain"

runs:
    using: "composite"
    steps:

      # Runs before anything is installed so a full disk is freed before this
      # job needs space. Sibling script, not `uses:`: a composite action can only
      # reference another action at a fixed ref, which would drift from this one.
      - name: Evict stale runner caches
        if: ${{ runner.environment == 'self-hosted' && runner.os == 'Linux' }}
        shell: bash
        run: |
          timeout 600 python3 "$GITHUB_ACTION_PATH/../cache-maintenance/cache_maintenance.py" \
            || echo "::warning::cache maintenance did not finish (exit $?)"

      - name: Read rust-toolchain configuration
        id: rust-toolchain
        shell: bash
        run: |
          # Extract values from rust-toolchain.toml
          TOOLCHAIN=$(grep 'channel =' rust-toolchain.toml | sed 's/.*= "\(.*\)"/\1/' | tr -d '"')
          TARGETS=$(grep 'targets =' rust-toolchain.toml | sed 's/.*= \[\(.*\)\]/\1/' | tr -d '[]"' | tr ',' '\n' | xargs | tr ' ' ',')
          COMPONENTS=$(grep 'components =' rust-toolchain.toml | sed 's/.*= \[\(.*\)\]/\1/' | tr -d '[]"' | tr ',' '\n' | xargs | tr ' ' ',')

          # Print the extracted values
          echo "Toolchain: $TOOLCHAIN"
          echo "Targets: $TARGETS"
          echo "Components: $COMPONENTS"

          # Set outputs for use in subsequent steps
          {
            echo "toolchain=$TOOLCHAIN"
            echo "targets=$TARGETS"
            echo "components=$COMPONENTS"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
          targets: ${{ steps.rust-toolchain.outputs.targets }}
          components: ${{ steps.rust-toolchain.outputs.components }}
