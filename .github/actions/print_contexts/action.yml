# Debug aid: prints the workflow contexts and identity probes in collapsed
# groups. Contexts go through env, not inlined into the script, so a quote in a
# value cannot break or inject into the shell. Secrets and env print as names
# only. Design: README.md.

name: "print_contexts"
description: "Print workflow contexts, secret names and identity/tool probes in collapsed log groups, for debugging."

inputs:
    INPUTS_CONTEXT:
        description: "The inputs context as json"
        required: false
    NEEDS_CONTEXT:
        description: "The needs context as json"
        required: false
    VARS_CONTEXT:
        description: "The vars context as json"
        required: false
    SECRETS_CONTEXT:
        description: "The secrets context as json; only the names are printed, values are masked"
        required: false
    STEPS_CONTEXT:
        description: "The steps context as json"
        required: false
    probes:
        description: "Comma-separated probes to run: tools, npm, docker, aws, gh. A failing probe never fails the step."
        required: false
        default: "tools"

runs:
    using: "composite"
    steps:

      - name: Print contexts
        shell: bash
        env:
            GITHUB_CONTEXT: ${{ toJson(github) }}
            ENV_CONTEXT: ${{ toJson(env) }}
            JOB_CONTEXT: ${{ toJson(job) }}
            RUNNER_CONTEXT: ${{ toJson(runner) }}
            STRATEGY_CONTEXT: ${{ toJson(strategy) }}
            MATRIX_CONTEXT: ${{ toJson(matrix) }}
            VARS_CONTEXT: ${{ inputs.VARS_CONTEXT }}
            SECRETS_CONTEXT: ${{ inputs.SECRETS_CONTEXT }}
            NEEDS_CONTEXT: ${{ inputs.NEEDS_CONTEXT }}
            INPUTS_CONTEXT: ${{ inputs.INPUTS_CONTEXT }}
            STEPS_CONTEXT: ${{ inputs.STEPS_CONTEXT }}
            PROBES: ${{ inputs.probes }}
        run: timeout 150 python3 "$GITHUB_ACTION_PATH/print_contexts.py" --probes "$PROBES" || echo "print_contexts failed; continuing"
