# Restores cargo registry, git and target from GitHub's cache on hosted
# runners. Self-hosted runner VMs keep these on disk
# (https://github.com/prosopo/gh-runner), so restoring there is skipped.
# New code should use restore-cache, which supports the main/PR save rules.

name: "restore_cargo_cache"
description: "Restore the cargo registry, git and target caches on GitHub-hosted runners."

inputs:
  restore-on-self-hosted:
    description: "Whether to restore cache on self-hosted runners"
    required: false
    default: "false"

runs:
    using: "composite"
    steps:

      # dirs must exist before cache restore
      - name: Make dirs
        shell: bash
        run: |
          mkdir -p ~/.cargo
          mkdir -p ~/.cargo/registry
          mkdir -p ~/.cargo/git
          mkdir -p target

      - name: Restore cache
        if: ${{ runner.environment != 'self-hosted' || inputs.restore-on-self-hosted == 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
            # must restore all cache dirs, and they must exist ahead of this!
            path: |
                ~/.cargo/registry
                ~/.cargo/git
                target
                **/target
                !**/target/**/target
            # note that restoring a cache in github is a pain. The trailing '-' matches any string after the '-', therefore 'abc-' would match a cache named 'abc-1234' or 'abc-5678', etc.
            # the problem is 'abc-' will not match a cache named 'abc'! So if you're using wildcard cache name selectors like this, you need a field that changes as the suffix to become the wildcard
            # here we're setting the key to an unused cache key so it falls back to the wildcard selector in `restore-keys`
            # we're hashing all package lock json files to create a unique cache key
            # thus if you install new deps / update a package lock, the cache will be invalidated and a new cache will be created
            key: some-unused-cache-key
            restore-keys: |
                cargo-${{ runner.os }}-${{ runner.arch }}-
